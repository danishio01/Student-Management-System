<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            background: #f3f6fb;
            color: #172033;
            font-family: Arial, Helvetica, sans-serif;
        }

        main {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 5vw, 2.25rem);
            letter-spacing: -0.04em;
        }

        .intro {
            margin: 0 0 28px;
            color: #64708a;
            line-height: 1.5;
        }

        .card {
            padding: 32px;
            border: 1px solid #e1e7f0;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 16px 40px rgba(31, 48, 79, 0.09);
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.92rem;
            font-weight: 600;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            min-height: 46px;
            padding: 11px 13px;
            border: 1px solid #ccd5e2;
            border-radius: 8px;
            background: #fff;
            color: #172033;
            font: inherit;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        input[type="text"]::placeholder,
        input[type="email"]::placeholder {
            color: #98a2b3;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: #4263eb;
            outline: none;
            box-shadow: 0 0 0 3px rgba(66, 99, 235, 0.15);
        }

        button {
            width: 100%;
            min-height: 48px;
            margin-top: 4px;
            border: 0;
            border-radius: 8px;
            background: #3156d3;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background 150ms ease, transform 150ms ease;
        }

        button:hover {
            background: #2445b4;
        }

        button:active {
            transform: translateY(1px);
        }

        button:focus-visible {
            outline: 3px solid rgba(66, 99, 235, 0.35);
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            body {
                padding: 32px 16px;
            }

            .card {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1 align="center">Student Form</h1>
        <p class="intro" align="center">Enter your details below to complete your student profile.</p>

        <form class="card" action="#" method="post">
            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your full name" autocomplete="name" required>
            </div>

            <div class="field">
                <label for="semester">Semester</label>
                <input type="text" id="semester" name="semester" placeholder="e.g. 3rd semester" required>
            </div>

            <div class="field">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" placeholder="e.g. Computer Science" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            </div>

            <button type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
